# Unified Docker Compose file with profiles for the Livestream Assistant Agent
# Usage:
#   docker compose --profile full up -d          # Start everything
#   docker compose --profile kafka up -d         # Start Kafka cluster only
#   docker compose --profile dev up -d           # Start minimal dev stack (single Kafka + Redis)
#   docker compose --profile cdc up -d           # Start CDC pipeline
#   docker compose --profile agent up -d         # Start agent service

services:
  # ============================================
  # KAFKA CLUSTER (3 nodes - production-like)
  # Profile: kafka, full
  # ============================================
  kafka-1:
    image: apache/kafka:latest
    hostname: kafka-1
    container_name: kafka-kraft-1
    restart: always
    profiles: ["kafka", "full"]
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: "eriUGQy1SCyp8PI4uT89lA"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka-1:9092,CONTROLLER://kafka-1:9093,INTERNAL://kafka-1:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092,INTERNAL://kafka-1:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    networks:
      - mlops-k6-network
    healthcheck:
      test: ["CMD-SHELL", "./opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-1:9092 > /dev/null 2>&1"]
      start_period: 20s
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - kafka-data-1:/var/lib/kafka/data

  kafka-2:
    image: apache/kafka:latest
    hostname: kafka-2
    container_name: kafka-kraft-2
    restart: always
    profiles: ["kafka", "full"]
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_CLUSTER_ID: "eriUGQy1SCyp8PI4uT89lA"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka-2:9092,CONTROLLER://kafka-2:9093,INTERNAL://kafka-2:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092,INTERNAL://kafka-2:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    networks:
      - mlops-k6-network
    healthcheck:
      test: ["CMD-SHELL", "./opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-2:9092 > /dev/null 2>&1"]
      start_period: 20s
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - kafka-data-2:/var/lib/kafka/data

  kafka-3:
    image: apache/kafka:latest
    hostname: kafka-3
    container_name: kafka-kraft-3
    restart: always
    profiles: ["kafka", "full"]
    ports:
      - "39092:9092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_CLUSTER_ID: "eriUGQy1SCyp8PI4uT89lA"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka-3:9092,CONTROLLER://kafka-3:9093,INTERNAL://kafka-3:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:39092,INTERNAL://kafka-3:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    networks:
      - mlops-k6-network
    healthcheck:
      test: ["CMD-SHELL", "./opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-3:9092 > /dev/null 2>&1"]
      start_period: 20s
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - kafka-data-3:/var/lib/kafka/data

  # ============================================
  # KAFKA SINGLE NODE (lightweight dev)
  # Profile: dev
  # ============================================
  kafka-single:
    container_name: kafka-single
    image: apache/kafka:latest
    profiles: ["dev"]
    ports:
      - "9092:9092"
      - "9094:9094"
    networks:
      - mlops-k6-network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: 'comment-events-cluster-1'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-single:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: >
        PLAINTEXT://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:9094,
        CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka-single:9092,
        EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "./opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - ./docker/kafka_data:/var/lib/kafka/data

  # ============================================
  # SCHEMA REGISTRY
  # Profile: kafka, dev, full, cdc
  # ============================================
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: kafka-schema-registry
    profiles: ["kafka", "dev", "full", "cdc"]
    depends_on:
      kafka-1:
        condition: service_healthy
        required: false
      kafka-single:
        condition: service_healthy
        required: false
      kafka-2:
        condition: service_healthy
        required: false
      kafka-3:
        condition: service_healthy
        required: false
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8081/subjects"]
      start_period: 10s
      interval: 10s
      retries: 20
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      # Uses kafka-1 for cluster mode, kafka-single for dev mode
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:9094,kafka-2:9094,kafka-3:9094
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    restart: unless-stopped
    networks:
      - mlops-k6-network

  # ============================================
  # KAFKA UI
  # Profile: kafka, dev, full
  # ============================================
  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    profiles: ["kafka", "dev", "full"]
    ports:
      - "8080:8080"
    restart: always
    environment:
      KAFKA_CLUSTERS_0_NAME: livestream-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9094,kafka-2:9094,kafka-3:9094
      KAFKA_CLUSTERS_0_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - mlops-k6-network

  # ============================================
  # REDIS (Feature Store)
  # Profile: redis, dev, full, agent
  # ============================================
  redis:
    image: redis:latest
    container_name: online-store-redis
    profiles: ["redis", "dev", "full", "agent"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 20s
    networks:
      - mlops-k6-network

  # ============================================
  # AGENT (FastAPI + Spark NLP)
  # Profile: agent, full
  # ============================================
  livestream-agent:
    container_name: livestream-agent
    profiles: ["agent"]
    build:
      context: .
      dockerfile: ./docker/agent/Dockerfile
    env_file:
      - .env.docker
    environment:
      - IS_APPLE_SILICON=${IS_APPLE_SILICON:-false}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src/agent/data:/app/data
      - ./.ivy2:/root/.ivy2
      - ./.m2:/root/.m2
      - ~/cache_pretrained:/root/cache_pretrained
    networks:
      - mlops-k6-network

  # ============================================
  # CDC POSTGRESQL (Source Database)
  # Profile: cdc, full
  # ============================================
  cdc-postgresql:
    image: postgres:15-alpine
    container_name: cdc-postgresql
    profiles: ["cdc", "full"]
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_DB: ${CDC_POSTGRES_DB:-cdc}
      POSTGRES_USER: ${CDC_POSTGRES_USER:-cdc}
      POSTGRES_PASSWORD: ${CDC_POSTGRES_PASSWORD:-cdc}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CDC_POSTGRES_USER:-cdc}"]
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - cdc_postgresql_data:/var/lib/postgresql/data
    networks:
      - mlops-k6-network

  # ============================================
  # KAFKA CONNECT (Debezium)
  # Profile: cdc, full
  # ============================================
  kafka-connect:
    profiles: ["cdc", "full"]
    build:
      context: ./src/kafka_connect
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    ports:
      - "8083:8083"
    depends_on:
      cdc-postgresql:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "-X", "GET", "http://localhost:8083/connectors"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      BOOTSTRAP_SERVERS: kafka-1:9094,kafka-2:9094,kafka-3:9094
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_TOPIC_CREATION_ENABLE: true
      POSTGRES_HOST: cdc-postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: cdc
      POSTGRES_USER: cdc
      POSTGRES_PASSWORD: cdc
    restart: always
    networks:
      - mlops-k6-network

  # ============================================
  # DEBEZIUM UI
  # Profile: cdc, full
  # ============================================
  debezium-ui:
    image: debezium/debezium-ui:1.9
    platform: linux/amd64
    container_name: debezium-ui
    hostname: debezium-ui
    profiles: ["cdc", "full"]
    restart: always
    depends_on:
      kafka-connect:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      KAFKA_CONNECT_URIS: http://kafka-connect:8083
    networks:
      - mlops-k6-network

  # ============================================
  # CDC PRODUCER (Python)
  # Profile: cdc, full
  # ============================================
  cdc-producer:
    container_name: cdc-producer
    profiles: ["cdc", "full"]
    build:
      context: .
      dockerfile: ./docker/cdc_producer/Dockerfile
    depends_on:
      cdc-postgresql:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      POSTGRES_HOST: cdc-postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: cdc
      POSTGRES_USER: cdc
      POSTGRES_PASSWORD: cdc
    networks:
      - mlops-k6-network

  # ============================================
  # KAFKA PRODUCER
  # Profile: producer, full
  # ============================================
  kafka-producer:
    container_name: kafka-producer
    profiles: ["producer"]
    build:
      context: .
      dockerfile: ./docker/producer/Dockerfile
    env_file:
      - .env.docker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9094,kafka-2:9094,kafka-3:9094
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_OUTPUT_TOPICS: tracking.user_comments
    depends_on:
      schema-registry:
        condition: service_healthy
    networks:
      - mlops-k6-network

  # ============================================
  # DATA WAREHOUSE (PostgreSQL)
  # Profile: dwh, full
  # ============================================
  postgres-dwh:
    image: postgres:15-alpine
    container_name: postgres-dwh
    profiles: ["dwh"]
    environment:
      POSTGRES_DB: ${DWH_POSTGRES_DB:-dwh}
      POSTGRES_USER: ${DWH_POSTGRES_USER:-dwh}
      POSTGRES_PASSWORD: ${DWH_POSTGRES_PASSWORD:-dwh}
    ports:
      - "5433:5432"
    volumes:
      - postgres-dwh-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DWH_POSTGRES_USER:-dwh} -d ${DWH_POSTGRES_DB:-dwh}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - mlops-k6-network

# ============================================
# VOLUMES
# ============================================
volumes:
  kafka-data-1:
  kafka-data-2:
  kafka-data-3:
  cdc_postgresql_data:
  postgres-dwh-volume:

# ============================================
# NETWORKS
# ============================================
networks:
  mlops-k6-network:
    driver: bridge